<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>🌿 Forest Grid Map Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Patch for MultiPolygon -->
  <script>
    if (typeof L.MultiPolygon === "undefined") {
      L.MultiPolygon = function(latlngs, options) {
        return new L.Polygon(latlngs, options);
      };
    }
  </script>

  <!-- Leaflet KML parser -->
  <script src="https://unpkg.com/leaflet-kml@latest/L.KML.js"></script>

  <!-- ✅ Working measurement plugin -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-measure-path@2.2.0/leaflet-measure-path.css" />
  <script src="https://unpkg.com/leaflet-measure-path@2.2.0/leaflet-measure-path.min.js"></script>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #ecf8ef;
    }
    #header {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 16px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-weight: 600;
      font-size: 16px;
      color: #2b9348;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      z-index: 9999;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 18px 36px;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      color: #2b9348;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      z-index: 9998;
      transition: opacity 0.4s ease;
    }
    .grid-label { pointer-events: none; }
  </style>
</head>
<body>
  <div id="header">🌿 Forest Department — Grid Viewer</div>
  <div id="loading">📂 Fetching KML... please wait</div>
  <div id="map"></div>

  <script>
    const map = L.map("map").setView([11.3, 78.5], 10);

    const base = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { attribution: "&copy; Esri — Satellite Imagery", maxZoom: 19 }
    ).addTo(map);

    // ✅ Add working measurement control (leaflet-measure-path)
    if (L.control.measurePath) {
      L.control.measurePath({
        showUnitControl: true,
        measureArea: true,
        measureDistance: true,
        position: "topleft",
        activeColor: "#2b9348",
        completedColor: "#ff6600"
      }).addTo(map);
    } else {
      console.warn("⚠️ Measurement plugin not loaded.");
    }

    // --- Live Location Button ---
    let locMarker = null;
    let watchId = null;

    const blueDotIcon = L.divIcon({
      className: 'blue-dot',
      html: '<div style="width:14px; height:14px; background-color:#007bff; border-radius:50%; border:2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    const locButton = L.control({ position: "topright" });
    locButton.onAdd = function() {
      const btn = L.DomUtil.create("button", "loc-button");
      btn.innerHTML = "📍 Live Location";
      btn.style.cssText = "padding: 8px 12px; font-weight: bold; background: white; border: 2px solid rgba(0,0,0,0.2); border-radius: 5px; cursor: pointer; color: #333; box-shadow: 0 1px 4px rgba(0,0,0,0.3);";
      
      let isTracking = false;
      btn.onclick = function() {
        if (!isTracking) {
          btn.style.background = "#e6f7ff";
          btn.style.color = "#007bff";
          isTracking = true;
          if (navigator.geolocation) {
             // Fetch immediately
             navigator.geolocation.getCurrentPosition(updatePosition, err => console.warn(err), { enableHighAccuracy: true });
             // Then every 2 seconds
             watchId = setInterval(() => {
                 navigator.geolocation.getCurrentPosition(updatePosition, err => console.warn(err), { enableHighAccuracy: true });
             }, 2000);
          } else {
             alert("Geolocation is not supported by this browser.");
          }
        } else {
          // Stop tracking
          btn.style.background = "white";
          btn.style.color = "#333";
          isTracking = false;
          clearInterval(watchId);
          if (locMarker) {
             map.removeLayer(locMarker);
             locMarker = null;
          }
        }
      };
      return btn;
    };
    locButton.addTo(map);

    function updatePosition(pos) {
        const latlng = [pos.coords.latitude, pos.coords.longitude];
        if (!locMarker) {
            locMarker = L.marker(latlng, {icon: blueDotIcon}).addTo(map);
            map.setView(latlng, 16);
        } else {
            locMarker.setLatLng(latlng);
        }
    }

    // Loader handler
    function hideLoader() {
      const el = document.getElementById("loading");
      el.style.opacity = "0";
      setTimeout(() => (el.style.display = "none"), 400);
    }

    // --- Fetch KML ---
    const params = new URLSearchParams(window.location.search);
    const fileId = params.get("id");
    if (!fileId) {
      alert("❌ Missing KML ID in URL!");
      throw new Error("No ?id= parameter");
    }

    const kmlUrl = `https://cdn.jsdelivr.net/gh/krishnaSureshFor/tnforest_kml_to_grid_v3.0@main/public_kml/${fileId}.kml`;
    console.log("📂 Fetching KML from:", kmlUrl);

    fetch(kmlUrl)
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(kmlText => {
        const clean = kmlText.replace(/<\/*\w+:/g, m => m.replace(/[\w:]+:/, ""));
        const xml = new DOMParser().parseFromString(clean, "text/xml");
        const kml = new L.KML(xml);

        const gridGroup = L.layerGroup();
        const overlayGroup = L.layerGroup();

        // ✅ Safe handling for undefined names
        kml.eachLayer(l => {
          const name = (l?.feature?.properties?.name ?? "").toString().toLowerCase();
          if (name.includes("overlay")) overlayGroup.addLayer(l);
          else gridGroup.addLayer(l);
        });

        gridGroup.addTo(map);
        overlayGroup.addTo(map);

        L.control.layers(null, {
          "Grid Cells": gridGroup,
          "Overlay Boundary": overlayGroup
        }).addTo(map);

        setTimeout(() => {
          try {
            const bounds = kml.getBounds();
            if (bounds?.isValid()) map.fitBounds(bounds);
          } catch (e) {}
          hideLoader();
        }, 700);
      })
      .catch(err => {
        console.error("❌ Failed to load KML:", err);
        hideLoader();
        alert("⚠️ Could not load KML. Check console for details.");
      });
  </script>
</body>
</html>
